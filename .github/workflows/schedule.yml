name: CNNVD Weekly Crawl

on:
  schedule:
    # Run every Sunday at 00:00 UTC.
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Run tests
        run: npm test

      - name: Run crawler
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run start:cnnvd

      - name: Create or update result pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: 주간 크롤링 결과 업데이트"
          title: "chore: 주간 크롤링 결과 업데이트"
          body: |
            ## Summary
            - update `output/result.json` from the scheduled weekly crawl

            ## Notes
            - generated by GitHub Actions
            - created to respect the protected `main` branch workflow
          branch: "bot/weekly-crawl-result"
          base: "main"
          delete-branch: false
          add-paths: |
            output/result.json
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
