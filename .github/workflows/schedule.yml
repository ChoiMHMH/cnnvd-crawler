name: CNNVD Weekly Crawl

on:
  schedule:
    # 매주 일요일 00:00 UTC 자동 실행
    - cron: "0 0 * * 0"
  # 수동 실행 가능
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: 의존성 설치
        run: npm ci

      - name: Puppeteer 의존성 설치 (Linux)
        run: npx puppeteer browsers install chrome

      - name: 크롤링 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node index.mjs

      - name: 결과 파일 커밋
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: 주간 크롤링 결과 업데이트"
          file_pattern: "output/result.json"
